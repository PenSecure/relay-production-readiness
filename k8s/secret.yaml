# LOCAL DEVELOPMENT ONLY: these values match k8s/postgres.yaml.
# Production secrets come from AWS Secrets Manager via External Secrets
# (k8s/prod/externalsecret.yaml) and are never committed.
apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://relay:relay-local-pw@postgres:5432/relay
  SIGNING_SECRET: local-signing-secret-not-for-prod
