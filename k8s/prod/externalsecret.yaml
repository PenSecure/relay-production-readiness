# Requires the External Secrets Operator and a ClusterSecretStore named
# "aws-secrets-manager" (platform team). The DATABASE_URL secret should carry
# sslmode=verify-full against the RDS CA.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: relay-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: relay-prod/database-url
    - secretKey: SIGNING_SECRET
      remoteRef:
        key: relay-prod/signing-secret
