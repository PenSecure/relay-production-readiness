apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay
spec:
  podSelector:
    matchLabels:
      app: relay
  policyTypes: [Ingress, Egress]
  ingress:
    # App port only (ALB via NodePort, kubelet probes, Prometheus scrape).
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Postgres (managed DB; tighten to its CIDR per environment).
    - ports:
        - { port: 5432, protocol: TCP }
    # HTTPS to AWS APIs (S3, STS for IRSA).
    - ports:
        - { port: 443, protocol: TCP }
