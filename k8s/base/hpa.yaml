apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relay
  # min 3: one pod can be lost (node, zone, deploy) with headroom for 400 req/s.
  # max 8: capped by the DB connection budget (see configmap). Raising this
  #        means lowering PG_POOL_MAX or adding a pooler such as RDS Proxy.
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping on bursty launch traffic
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
